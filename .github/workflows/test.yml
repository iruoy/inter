# Builds the fonts and runs the QA tests (fontbakery) on pull requests.
name: Test

on:
  pull_request:
    branches: [master]
    paths:
      - "src/**"
      - Makefile
      - pyproject.toml
      - uv.lock
      - .python-version
      - version.txt
      - "misc/tools/**"
      - .github/workflows/test.yml
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Setup python venv
        run: make venv

      - name: make test
        run: make -j$(nproc) test
